name: Validate Skill

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate structure and pinned Core
        run: python3 product-experience-reviewer/scripts/validate_skill.py --root .
      - name: Validate passing fixture
        run: python3 product-experience-reviewer/scripts/validate_skill.py --root . --report product-experience-reviewer/fixtures/pass-report.md
      - name: Verify incomplete fixture fails closed
        shell: bash
        run: |
          set +e
          python3 product-experience-reviewer/scripts/validate_skill.py --root . --report product-experience-reviewer/fixtures/fail-report-incomplete.md
          code=$?
          set -e
          test "$code" -eq 2
